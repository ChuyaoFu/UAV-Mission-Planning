# GENERATED-BY-HAND for the official-compat profile: gz -> ROS (all one-way).
# Stereo images go straight to the official names (frame_id = gz_frame_id oak_left/oak_right);
# camera_info and depth are fixed up by oak_sim_driver.py; /gz/* are sim-side only.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /stereo/left/image
  gz_topic_name: /gz/oak/left/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /stereo/right/image
  gz_topic_name: /gz/oak/right/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /gz/oak/left/camera_info
  gz_topic_name: /gz/oak/left/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: /gz/oak/right/camera_info
  gz_topic_name: /gz/oak/right/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: /gz/oak/depth/image
  gz_topic_name: /gz/oak/depth/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
