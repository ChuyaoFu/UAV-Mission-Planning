- ros_topic_name: /gz/oak/depth/camera_info
  gz_topic_name: /gz/oak/depth/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: /oak/imu
  gz_topic_name: /gz/oak/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
- ros_topic_name: /gz/gt/odometry
  gz_topic_name: /gz/gt/odometry
